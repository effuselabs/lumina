services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: lumina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lumina_dev
      POSTGRES_USER: lumina
      POSTGRES_PASSWORD: lumina_dev_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lumina -d lumina_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: lumina-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # The application itself is NOT containerised for local development.
  # `npm run dev` is faster, gives working HMR, and avoids maintaining a
  # Dockerfile that only existed for this. Prisma Studio likewise runs
  # directly via `npm run db:studio`.

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: lumina-network
