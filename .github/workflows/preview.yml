name: Preview Deployment

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, closed]

env:
  NODE_VERSION: '20'

jobs:
  # Deploy preview for opened/updated PRs
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run pre-deployment checks
        run: |
          npm run type-check
          npm run lint
          npm run db:generate

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          NEXTAUTH_SECRET: dummy-secret-for-build
          NEXTAUTH_URL: http://localhost:3000

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          echo "$HOME/.railway/bin" >> $GITHUB_PATH

      - name: Create preview deployment
        id: deploy
        run: |
          railway login --token ${{ secrets.RAILWAY_TOKEN }}
          
          # Create a unique service name for this PR
          SERVICE_NAME="lumina-pr-${{ github.event.number }}"
          echo "service_name=$SERVICE_NAME" >> $GITHUB_OUTPUT
          
          # Deploy to Railway with PR-specific environment
          railway service create $SERVICE_NAME || true
          railway service connect $SERVICE_NAME
          
          # Set environment variables for preview
          railway variables set NEXTAUTH_URL="https://$SERVICE_NAME.railway.app"
          railway variables set NODE_ENV="preview"
          railway variables set PREVIEW_MODE="true"
          
          # Deploy the application
          DEPLOYMENT_URL=$(railway up --detach --json | jq -r '.url')
          echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          
          echo "🚀 Preview deployed to: $DEPLOYMENT_URL"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Wait for deployment
        run: |
          echo "Waiting for preview deployment to be ready..."
          sleep 45

      - name: Run database migrations for preview
        run: |
          railway login --token ${{ secrets.RAILWAY_TOKEN }}
          railway service connect lumina-pr-${{ github.event.number }}
          railway run npm run db:migrate:prod
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Seed preview database
        run: |
          railway login --token ${{ secrets.RAILWAY_TOKEN }}
          railway service connect lumina-pr-${{ github.event.number }}
          railway run npm run db:seed
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Verify preview deployment
        run: |
          PREVIEW_URL="${{ steps.deploy.outputs.deployment_url }}"
          
          # Wait for the preview to be accessible
          for i in {1..20}; do
            if curl -f "$PREVIEW_URL/api/health" > /dev/null 2>&1; then
              echo "✅ Preview deployment is healthy!"
              break
            else
              echo "⏳ Waiting for preview to be ready... (attempt $i/20)"
              sleep 15
            fi
            
            if [[ $i -eq 20 ]]; then
              echo "❌ Preview deployment health check failed"
              exit 1
            fi
          done

      - name: Comment on PR with preview link
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            // Check if we already have a preview comment
            const existingComment = comments.find(comment => 
              comment.user.login === 'github-actions[bot]' && 
              comment.body.includes('🚀 Preview Deployment')
            );

            const previewUrl = '${{ steps.deploy.outputs.deployment_url }}';
            const serviceName = '${{ steps.deploy.outputs.service_name }}';
            
            const commentBody = `## 🚀 Preview Deployment Ready!

            Your preview deployment is ready for testing:

            **🔗 Preview URL:** ${previewUrl}
            **📦 Service:** \`${serviceName}\`
            **📝 Commit:** \`${context.sha.substring(0, 7)}\`

            ### 🧪 Test Areas
            - [ ] UI Design System: [${previewUrl}/design-system](${previewUrl}/design-system)
            - [ ] Authentication Flow
            - [ ] Database Connectivity
            - [ ] API Endpoints

            ### 📋 Preview Features
            - ✅ Full database with seed data
            - ✅ All environment configurations
            - ✅ Real-time updates with code changes
            - ✅ Isolated from production data

            ---
            *This preview will be automatically cleaned up when the PR is closed.*`;

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }

  # Cleanup preview when PR is closed
  cleanup-preview:
    name: Cleanup Preview
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    
    steps:
      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          echo "$HOME/.railway/bin" >> $GITHUB_PATH

      - name: Remove preview deployment
        run: |
          railway login --token ${{ secrets.RAILWAY_TOKEN }}
          
          SERVICE_NAME="lumina-pr-${{ github.event.number }}"
          
          # Connect and delete the service
          railway service connect $SERVICE_NAME || echo "Service not found"
          railway service delete --yes || echo "Service already deleted"
          
          echo "🧹 Preview deployment cleaned up: $SERVICE_NAME"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Comment on PR about cleanup
        uses: actions/github-script@v7
        with:
          script: |
            const commentBody = `## 🧹 Preview Deployment Cleaned Up

            The preview deployment for this PR has been automatically removed.

            **📦 Service:** \`lumina-pr-${{ github.event.number }}\`
            **🗑️ Status:** Deleted

            Thank you for testing! 🙏`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });