name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: '20'

jobs:
  # Determine deployment environment
  setup:
    name: Setup Deployment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      railway_service: ${{ steps.env.outputs.railway_service }}
      
    steps:
      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi
          
          # Set Railway service based on environment
          if [[ "${{ steps.env.outputs.environment || 'production' }}" == "production" ]]; then
            echo "railway_service=lumina-prod" >> $GITHUB_OUTPUT
          else
            echo "railway_service=lumina-staging" >> $GITHUB_OUTPUT
          fi

  # Pre-deployment checks
  pre-deploy:
    name: Pre-deployment Checks
    runs-on: ubuntu-latest
    needs: [setup]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check

      - name: Run linting
        run: npm run lint

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          NEXTAUTH_SECRET: dummy-secret-for-build
          NEXTAUTH_URL: http://localhost:3000

      - name: Generate Prisma client
        run: npm run db:generate

  # Deploy to Railway
  deploy:
    name: Deploy to ${{ needs.setup.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [setup, pre-deploy]
    environment: ${{ needs.setup.outputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          echo "$HOME/.railway/bin" >> $GITHUB_PATH

      - name: Deploy to Railway
        run: |
          railway login --token ${{ secrets.RAILWAY_TOKEN }}
          railway service connect ${{ needs.setup.outputs.railway_service }}
          railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Wait for deployment
        run: |
          echo "Waiting for deployment to complete..."
          sleep 30

      - name: Run database migrations
        run: |
          railway login --token ${{ secrets.RAILWAY_TOKEN }}
          railway service connect ${{ needs.setup.outputs.railway_service }}
          railway run npm run db:migrate:prod
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # Post-deployment verification
  verify-deployment:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [setup, deploy]
    
    steps:
      - name: Health check
        run: |
          if [[ "${{ needs.setup.outputs.environment }}" == "production" ]]; then
            HEALTH_URL="${{ secrets.PROD_HEALTH_URL }}"
          else
            HEALTH_URL="${{ secrets.STAGING_HEALTH_URL }}"
          fi
          
          echo "Checking health at: $HEALTH_URL"
          
          # Wait for deployment to be ready
          for i in {1..30}; do
            if curl -f "$HEALTH_URL/api/health" > /dev/null 2>&1; then
              echo "✅ Health check passed!"
              break
            else
              echo "⏳ Waiting for deployment... (attempt $i/30)"
              sleep 10
            fi
            
            if [[ $i -eq 30 ]]; then
              echo "❌ Health check failed after 5 minutes"
              exit 1
            fi
          done

      - name: Smoke tests
        run: |
          if [[ "${{ needs.setup.outputs.environment }}" == "production" ]]; then
            BASE_URL="${{ secrets.PROD_BASE_URL }}"
          else
            BASE_URL="${{ secrets.STAGING_BASE_URL }}"
          fi
          
          echo "Running smoke tests against: $BASE_URL"
          
          # Test main pages
          curl -f "$BASE_URL" > /dev/null
          curl -f "$BASE_URL/api/health" > /dev/null
          
          echo "✅ Smoke tests passed!"

  # Rollback capability
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    needs: [setup, deploy, verify-deployment]
    if: failure() && needs.deploy.result == 'success'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          echo "$HOME/.railway/bin" >> $GITHUB_PATH

      - name: Rollback deployment
        run: |
          railway login --token ${{ secrets.RAILWAY_TOKEN }}
          railway service connect ${{ needs.setup.outputs.railway_service }}
          railway rollback
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Notify rollback
        run: |
          echo "🔄 Deployment rolled back due to verification failure"

  # Notification
  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [setup, deploy, verify-deployment]
    if: always()
    
    steps:
      - name: Deployment success notification
        if: needs.verify-deployment.result == 'success'
        run: |
          echo "🚀 Successfully deployed to ${{ needs.setup.outputs.environment }}"
          echo "Environment: ${{ needs.setup.outputs.environment }}"
          echo "Service: ${{ needs.setup.outputs.railway_service }}"
          echo "Commit: ${{ github.sha }}"

      - name: Deployment failure notification
        if: needs.verify-deployment.result == 'failure' || needs.deploy.result == 'failure'
        run: |
          echo "❌ Deployment to ${{ needs.setup.outputs.environment }} failed"
          echo "Environment: ${{ needs.setup.outputs.environment }}"
          echo "Service: ${{ needs.setup.outputs.railway_service }}"
          echo "Commit: ${{ github.sha }}"