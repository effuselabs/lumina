name: Deploy

# Staging deploys automatically when CI passes on main.
# Production is a MANUAL promotion — you always choose when customers see a
# change. There is deliberately no automatic path to production.
#
# Production does not exist yet; it is stood up in Phase 6. Until then the
# production job refuses to run rather than half-deploying somewhere.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: '22'

jobs:
  staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    # Only after a green CI run, or an explicit manual staging deploy.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.environment == 'staging')
    environment:
      name: staging
      url: https://staging.uselumina.app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Apply database migrations
        # Before the deploy, so new code never meets an old schema.
        # `migrate deploy` only applies committed migrations — it never
        # generates or resets anything.
        run: railway run --service "$RAILWAY_SERVICE" npx prisma migrate deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_STAGING_SERVICE }}

      - name: Deploy
        run: railway up --service "$RAILWAY_SERVICE" --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_STAGING_SERVICE }}

      - name: Wait for health check
        # A deploy is not done until the app answers. /api/health also verifies
        # database connectivity, so this catches a bad DATABASE_URL.
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 https://staging.uselumina.app/api/health > /tmp/health.json; then
              echo "Responded on attempt ${attempt}:"
              cat /tmp/health.json
              if grep -q '"status":"healthy"' /tmp/health.json; then
                exit 0
              fi
              echo "::warning::Up but not healthy — see payload above."
            fi
            sleep 10
          done
          echo "::error::staging did not become healthy within 5 minutes."
          exit 1

  production:
    name: Deploy to production
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.environment == 'production'
    # Point this GitHub environment at a required reviewer so a production
    # deploy cannot proceed without a human approving it.
    environment:
      name: production
      url: https://uselumina.app

    steps:
      - name: Confirm production is provisioned
        run: |
          if [ -z "${{ secrets.RAILWAY_PRODUCTION_TOKEN }}" ]; then
            echo "::error::Production is not provisioned yet (Phase 6)."
            echo "Set RAILWAY_PRODUCTION_TOKEN and RAILWAY_PRODUCTION_SERVICE first."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Apply database migrations
        run: railway run --service "$RAILWAY_SERVICE" npx prisma migrate deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_PRODUCTION_SERVICE }}

      - name: Deploy
        run: railway up --service "$RAILWAY_SERVICE" --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_PRODUCTION_SERVICE }}

      - name: Wait for health check
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 https://uselumina.app/api/health > /tmp/health.json; then
              echo "Responded on attempt ${attempt}:"
              cat /tmp/health.json
              grep -q '"status":"healthy"' /tmp/health.json && exit 0
            fi
            sleep 10
          done
          echo "::error::production did not become healthy within 5 minutes."
          exit 1
