name: Deploy

# MANUAL DEPLOYS ONLY. Nothing here fires automatically.
#
# Routine staging deploys are handled by Railway itself: the service has GitHub
# auto-deploy enabled with "Wait for CI", so it deploys on a push to main only
# once the CI check is green. `.railway/railway.ts` supplies the rest —
# preDeployCommand, and healthcheckPath so Railway will not promote a release
# that fails to answer /api/health.
#
# That native path is strictly simpler than driving deploys from here: no token
# to manage or rotate, no service-name coupling, and no chance of this workflow
# racing Railway's own deploy. This file therefore exists for two cases only:
#
#   1. Re-deploying staging by hand (rollback, or a stuck deploy).
#   2. Promoting to production, which must never be automatic.
#
# Production does not exist yet; it is stood up in Phase 6. Until then the
# production job refuses to run rather than half-deploying somewhere.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: '22'

jobs:
  staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    if: inputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.uselumina.app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      # The service name is configuration rather than a credential, so it
      # lives in a repository variable. Failing loudly here beats `railway up
      # --service ""`, which deploys nowhere and still reports success.
      - name: Check the service is configured
        run: |
          if [ -z "${{ vars.RAILWAY_STAGING_SERVICE }}" ]; then
            echo "::error::vars.RAILWAY_STAGING_SERVICE is not set. Add it under"
            echo "Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      - name: Deploy
        # Migrations run via `deploy.preDeployCommand` in .railway/railway.ts,
        # Railway, where DATABASE_URL resolves to the Postgres plugin. That is
        # more reliable than running them from CI, and Railway aborts the
        # release if the pre-deploy command fails, so new code can never go
        # live against an un-migrated schema.
        run: |
          echo "DEPLOY_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          railway up --service "$RAILWAY_SERVICE" --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_STAGING_SERVICE }}

      - name: Wait for the new deployment to answer healthy
        # A deploy is done when the NEW process answers healthy, not when any
        # process does. This step used to accept the first healthy response,
        # and the old deployment is healthy by definition: on 2026-09-29, with
        # Railway's API degraded, it reported success 0.4s after `railway up`
        # returned while staging was still serving the previous commit.
        #
        # The commit field cannot tell them apart for an upload deploy —
        # `railway up` sets no RAILWAY_GIT_COMMIT_SHA, so it reads "unknown" —
        # but uptime can: a process younger than this deploy started after it.
        # /api/health also verifies database connectivity, so this still
        # catches a bad DATABASE_URL. Builds take four to five minutes, hence
        # ten minutes of patience.
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 10 https://staging.uselumina.app/api/health > /tmp/health.json; then
              status=$(jq -r .status /tmp/health.json)
              uptime=$(jq -r '.uptime | floor' /tmp/health.json)
              since_deploy=$(( $(date +%s) - DEPLOY_STARTED ))
              if [ "$status" = "healthy" ] && [ "$uptime" -lt "$since_deploy" ]; then
                echo "New deployment healthy on attempt ${attempt}:"
                cat /tmp/health.json
                exit 0
              fi
              echo "Attempt ${attempt}: status=${status}, uptime ${uptime}s, deploy started ${since_deploy}s ago — still the previous process."
            fi
            sleep 10
          done
          echo "::error::No new deployment answered healthy within 10 minutes. The previous one may still be serving:"
          cat /tmp/health.json || true
          exit 1

  production:
    name: Deploy to production
    runs-on: ubuntu-latest
    if: inputs.environment == 'production'
    # Point this GitHub environment at a required reviewer so a production
    # deploy cannot proceed without a human approving it.
    environment:
      name: production
      url: https://uselumina.app

    steps:
      - name: Confirm production is provisioned
        run: |
          if [ -z "${{ secrets.RAILWAY_PRODUCTION_TOKEN }}" ]; then
            echo "::error::Production is not provisioned yet (Phase 6)."
            echo "Set RAILWAY_PRODUCTION_TOKEN and RAILWAY_PRODUCTION_SERVICE first."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy
        # Migrations run via .railway/railway.ts preDeployCommand — see staging.
        run: railway up --service "$RAILWAY_SERVICE" --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_PRODUCTION_SERVICE }}

      - name: Wait for health check
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 https://uselumina.app/api/health > /tmp/health.json; then
              echo "Responded on attempt ${attempt}:"
              cat /tmp/health.json
              grep -q '"status":"healthy"' /tmp/health.json && exit 0
            fi
            sleep 10
          done
          echo "::error::production did not become healthy within 5 minutes."
          exit 1
