name: Secret scan

# Scans the full git history for committed credentials.
#
# Publishing is irreversible. A file can be deleted at any time; a secret that
# has been public for an hour has to be treated as burned, and forks and search
# indexes keep the history after a repository stops being public. This runs
# before the repository opens and keeps running afterwards — a leak is far
# easier to catch in review than to clean out of a history other people have
# already cloned.
#
# Findings do not belong in a public pull request: the diff would point straight
# at what to look for in the history that is still there. Rotate the credential
# first, then decide whether the history needs rewriting.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly. Catches rules added upstream that would flag something already
    # committed under an older ruleset.
    - cron: '0 6 * * 1'

permissions:
  contents: read

env:
  # Pinned rather than "latest": a scanner that changes under you turns a green
  # gate red for reasons unrelated to the commit being tested.
  GITLEAKS_VERSION: '8.30.1'

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, not the default shallow clone, which scans only
          # the tip — precisely the case that never leaks. Secrets are almost
          # always removed from the tip and left behind in history.
          fetch-depth: 0

      - name: Install gitleaks
        # The binary directly, not gitleaks/gitleaks-action. The tool is MIT
        # licensed and free; the action wrapper requires a paid licence for
        # organization accounts and fails in eight seconds without one. Running
        # the binary also means no third-party action needs a token.
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan history for secrets
        # --redact so a finding never prints the credential into a log that is
        # public on a public repository. The file, rule and commit are enough to
        # act on; the value itself is available locally to whoever fixes it.
        run: ./gitleaks git --redact --verbose --exit-code 1 .
