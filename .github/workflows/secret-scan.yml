name: Secret scan

# Scans the full git history for committed credentials.
#
# This exists because publishing is irreversible. A file can be deleted at any
# time; a secret that has been public for an hour has to be treated as burned,
# and forks and search indexes keep the history after a repository stops being
# public. So the scan runs before the repository opens, and keeps running
# afterwards — a leak is far easier to catch in review than to clean out of a
# history other people have already cloned.
#
# Findings do not belong in a public pull request: the diff would point straight
# at what to look for in the history that is still there. Rotate the credential
# first, then decide whether the history needs rewriting.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly. Catches rules added upstream that would flag something already
    # committed under an older ruleset.
    - cron: '0 6 * * 1'

# Declaring any permission sets every unlisted one to none, so `pull-requests`
# has to be granted explicitly: on a pull request the action reads the commit
# list to decide what to scan, and without it the job dies on a 403 before
# scanning anything.
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, not the default shallow clone, which scans only
          # the tip — precisely the case that never leaks. Secrets are almost
          # always removed from the tip and left behind in history.
          fetch-depth: 0

      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
